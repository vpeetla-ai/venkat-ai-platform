name: CI

# Org contract: lint → build → test. Aegis PR Review is a separate workflow.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: vap-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Compile check
        run: python -m compileall -q .

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Import smoke
        run: python -c "from app.main import app; print('app ok')"

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vpeetla-ai/golden-eval-registry
          path: golden-eval-registry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Install golden-eval-registry
        working-directory: ${{ github.workspace }}
        run: pip install -e ./golden-eval-registry
      - name: Pytest (includes golden eval gate)
        env:
          GOLDEN_EVAL_REGISTRY_PATH: ${{ github.workspace }}/golden-eval-registry
        run: pytest tests/ -q

  ci-ok:
    name: CI gate
    needs: [lint, build, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
