# Render Blueprint — Venkat AI Platform API
# S3.1 (Top-1% plan D2): starter = always-on for Principal panels (no free-tier spin-down).
# Apply in Render Dashboard → Blueprint sync, or manually set vap-api plan to Starter.
services:
  - type: web
    name: vap-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: AGENTFINOPS_API_KEY
        sync: false
      - key: AGENTFINOPS_URL
        value: https://agent-finops-api.onrender.com
      - key: LLM_GATEWAY_TENANT_ID
        value: vap
      - key: LLM_GATEWAY_API_KEY
        sync: false
      - key: LLM_GATEWAY_URL
        value: https://aegis-llm-gateway-api.onrender.com/v1
      - key: APP_ENV
        value: production
      - key: BACKEND_CORS_ORIGINS
        value: https://venkat-ai-platform.vercel.app,https://venkat-ai.com,https://www.venkat-ai.com
      - key: DATABASE_URL
        fromDatabase:
          name: vap-postgres
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_DEFAULT_PROVIDER
        value: groq
      - key: REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ENABLE_DB_PERSISTENCE
        value: "true"

databases:
  - name: vap-postgres
    plan: free
    region: oregon
